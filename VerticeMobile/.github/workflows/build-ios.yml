name: Build MAUI iOS

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-15 
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Clonar el código
      uses: actions/checkout@v4

    - name: Forzar Xcode 16.2 (Solución nativa al bloqueo)
      # Esto le quita el Xcode 16.4 por defecto a la máquina y le inyecta el 16.2 exacto que pide .NET 10
      run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Instalar motor de MAUI
      run: dotnet workload install maui

    - name: Compilar y Generar .ipa (Sin firma)
      run: dotnet publish VerticeMobile.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:BuildIpa=true

    - name: Subir el archivo descargable
      uses: actions/upload-artifact@v4
      with:
        name: VerticeApp-iOS
        path: '**/*.ipa'
